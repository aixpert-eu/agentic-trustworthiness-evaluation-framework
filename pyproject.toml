[project]
name = "aixpert-evaluation-framework"
version = "0.1.0"
description = "AIXPERT WP3 trustworthiness evaluation framework."
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "sacrebleu>=2.4",
    "rouge-score>=0.1",
    "nltk>=3.9",
    "bert-score>=0.3.13",
    "torch>=2.6",  # Python 3.13 wheels; older Torch releases cannot be installed.
    "codecarbon>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
math = ["sympy>=1.12"]
bias = ["unbias-plus"]
inobo = [
    "inobo @ git+ssh://git@github.com/aixpert-eu/aixpert-inobo.git",
    "tiktoken>=0.8",  # Python 3.13 wheels; UnBias-Plus pins the older 0.7 release.
]

[tool.uv]
# UnBias-Plus pins tiktoken 0.7, which lacks Python 3.13 wheels.
override-dependencies = [
    "tiktoken>=0.8",
    # UnBias-Plus only needs bitsandbytes for opt-in 4-bit quantization.
    "bitsandbytes==0.48.1; sys_platform != 'darwin'",
]

[project.scripts]
aixpert-setup-meteor = "metrics.common.meteor_setup:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: slow, network-dependent tests (opt-in via -m integration)"]
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
include = ["contracts*", "metrics*", "harness*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
